pilot_area:
  municipality: Boadilla del Monte
  province: Madrid

bbox:
  min_lon: -3.93
  min_lat: 40.38
  max_lon: -3.82
  max_lat: 40.45

# PNOA WMS download. Higher grid = smaller tiles = finer GSD.
# grid 20 + size 4096 ≈ 0.10–0.12 m/px on this bbox (better for YOLO roof crops).
pnoa:
  grid: 20
  size: 4096
  fallback_size: 2048

# Building crops / YOLO dataset defaults
crop:
  mode: rectangle
  margin_meters: 10

yolo:
  offset_meters: 10
